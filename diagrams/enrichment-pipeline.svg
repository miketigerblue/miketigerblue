<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family='Helvetica, Arial, "Liberation Sans", sans-serif' font-size="15" fill="#000">
<defs>
<filter id="sh" x="-5%" y="-5%" width="115%" height="125%"><feDropShadow dx="1.5" dy="3" stdDeviation="2.2" flood-color="#000" flood-opacity=".28"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4FD8"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E03A1E"/></marker>
</defs>
<rect width="1400" height="820" fill="#fff"/>
<text x="20" y="36" text-anchor="start" font-size="24" fill="#000" font-weight="bold">Intelligence Enrichment Pipeline (Tiger-Eye, the L1 Cyber Analyst pattern)</text>
<text x="20" y="60" text-anchor="start" font-size="15" fill="#000">every feed entry becomes a structured, reproducible threat assessment with its embedding stored beside it</text>
<rect x="20" y="100" width="220" height="72" rx="10" fill="#CCFFCC" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="130.0" y="123.4" text-anchor="middle" font-size="14" font-weight="bold">Wake</text>
<text x="130.0" y="140.9" text-anchor="middle" font-size="12">Postgres LISTEN/NOTIFY</text>
<text x="130.0" y="158.4" text-anchor="middle" font-size="12">or 60 s poll fallback</text>
<rect x="20" y="200" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="130.0" y="223.4" text-anchor="middle" font-size="14" font-weight="bold">Select unprocessed</text>
<text x="130.0" y="240.9" text-anchor="middle" font-size="12">archive LEFT JOIN analysis</text>
<text x="130.0" y="258.4" text-anchor="middle" font-size="12">oldest first, batch of 20</text>
<rect x="20" y="300" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="130.0" y="323.4" text-anchor="middle" font-size="14" font-weight="bold">Bounded concurrency</text>
<text x="130.0" y="340.9" text-anchor="middle" font-size="12">asyncio.Semaphore(5)</text>
<text x="130.0" y="358.4" text-anchor="middle" font-size="12">streak-based backoff</text>
<path d="M130 172 L130 198" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M130 272 L130 298" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M240 336 L300 336" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="300" y="100" width="330" height="150" rx="10" fill="#FFCCCC" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="152.1" text-anchor="middle" font-size="15" font-weight="bold">1 · RAG context</text>
<text x="465.0" y="170.9" text-anchor="middle" font-size="13">embed title + summary + content</text>
<text x="465.0" y="189.6" text-anchor="middle" font-size="13">pgvector cosine, distance &lt; 0.45</text>
<text x="465.0" y="208.4" text-anchor="middle" font-size="13">top 3, recency re-ranked, 1,500 tokens</text>
<path d="M630 175 L660 175" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="660" y="100" width="330" height="150" rx="10" fill="#FFCCCC" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="825.0" y="152.1" text-anchor="middle" font-size="15" font-weight="bold">2 · NVD context</text>
<text x="825.0" y="170.9" text-anchor="middle" font-size="13">CVE IDs pulled from the text</text>
<text x="825.0" y="189.6" text-anchor="middle" font-size="13">live CVSS, EPSS and KEV status</text>
<text x="825.0" y="208.4" text-anchor="middle" font-size="13">from cve_enriched</text>
<path d="M990 175 L1020 175" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="1020" y="100" width="330" height="150" rx="10" fill="#FFCCCC" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="1185.0" y="152.1" text-anchor="middle" font-size="15" font-weight="bold">3 · LLM analysis</text>
<text x="1185.0" y="170.9" text-anchor="middle" font-size="13">gpt-5.4-mini, strict json_schema</text>
<text x="1185.0" y="189.6" text-anchor="middle" font-size="13">21 fields: severity, actors, IOCs,</text>
<text x="1185.0" y="208.4" text-anchor="middle" font-size="13">TTPs, CVEs, actions, mitigations</text>
<rect x="300" y="310" width="330" height="150" rx="10" fill="#CCFFFF" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="465.0" y="362.1" text-anchor="middle" font-size="15" font-weight="bold">4 · Normalise</text>
<text x="465.0" y="380.9" text-anchor="middle" font-size="13">ATT&amp;CK technique IDs (260-entry map)</text>
<text x="465.0" y="399.6" text-anchor="middle" font-size="13">actor and malware aliases collapsed</text>
<text x="465.0" y="418.4" text-anchor="middle" font-size="13">Vidar Stealer → Vidar, Cozy Bear → APT29</text>
<path d="M630 385 L660 385" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="660" y="310" width="330" height="150" rx="10" fill="#CCFFFF" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="825.0" y="362.1" text-anchor="middle" font-size="15" font-weight="bold">5 · Embed</text>
<text x="825.0" y="380.9" text-anchor="middle" font-size="13">text-embedding-3-small</text>
<text x="825.0" y="399.6" text-anchor="middle" font-size="13">1,536 dimensions</text>
<text x="825.0" y="418.4" text-anchor="middle" font-size="13"></text>
<path d="M990 385 L1020 385" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="1020" y="310" width="330" height="150" rx="10" fill="#CCFFFF" stroke="#000" stroke-width="1.6" filter="url(#sh)"/>
<text x="1185.0" y="362.1" text-anchor="middle" font-size="15" font-weight="bold">6 · Persist</text>
<text x="1185.0" y="380.9" text-anchor="middle" font-size="13">analysis + embedding</text>
<text x="1185.0" y="399.6" text-anchor="middle" font-size="13">one transaction</text>
<text x="1185.0" y="418.4" text-anchor="middle" font-size="13">provenance on every row</text>
<path d="M1355 250 L1355 290 L455 290 L455 308" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<rect x="300" y="540" width="1080" height="54" rx="8" fill="#F5F5F5" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="840" y="562" text-anchor="middle" font-size="13" fill="#000">Provenance recorded per analysis: model_id · prompt_version · pipeline_version · prompt and response tokens · latency_ms · input_hash (SHA-256)</text>
<text x="840" y="582" text-anchor="middle" font-size="12.5" fill="#333">Per run: pipeline_runs with batch size, p50 and p95 latency, token totals and wake source. Failures to failed_enrichment, never silently dropped.</text>
<g filter="url(#sh)"><path d="M20 434 v132 a110.0 14 0 0 0 220 0 v-132 a110.0 14 0 0 0 -220 0z" fill="#CCCCFF" stroke="#000" stroke-width="1.6"/><ellipse cx="130.0" cy="434" rx="110.0" ry="14" fill="#CCCCFF" stroke="#000" stroke-width="1.6"/></g>
<text x="130.0" y="476.9" text-anchor="middle" font-size="14" font-weight="bold">PostgreSQL</text>
<text x="130.0" y="494.4" text-anchor="middle" font-size="12">+ pgvector (HNSW)</text>
<text x="130.0" y="511.9" text-anchor="middle" font-size="12"></text>
<text x="130.0" y="529.4" text-anchor="middle" font-size="12">analysis</text>
<text x="130.0" y="546.9" text-anchor="middle" font-size="12">analysis_embedding</text>
<path d="M1185 460 L1185 505 L242 505" fill="none" stroke="#E03A1E" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="700" y="498" text-anchor="middle" font-size="12" fill="#E03A1E">write analysis + embedding</text>
<rect x="300" y="620" width="1080" height="160" rx="14" fill="#F4FFF4" stroke="#57C84D" stroke-width="3"/>
<text x="320" y="646" text-anchor="start" font-size="15" fill="#000" font-weight="bold">Served from the same database</text>
<rect x="320" y="658" width="250" height="100" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="445.0" y="695.9" text-anchor="middle" font-size="13.5" font-weight="bold">Hybrid search</text>
<text x="445.0" y="712.7" text-anchor="middle" font-size="11.5">pgvector + Postgres full text,</text>
<text x="445.0" y="729.6" text-anchor="middle" font-size="11.5">fused by Reciprocal Rank Fusion</text>
<rect x="584" y="658" width="250" height="100" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="709.0" y="695.9" text-anchor="middle" font-size="13.5" font-weight="bold">Internal API</text>
<text x="709.0" y="712.7" text-anchor="middle" font-size="11.5">/health · /internal/search/text</text>
<text x="709.0" y="729.6" text-anchor="middle" font-size="11.5">/internal/search/vector · /node/{id}</text>
<rect x="848" y="658" width="250" height="100" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="973.0" y="695.9" text-anchor="middle" font-size="13.5" font-weight="bold">Observability</text>
<text x="973.0" y="712.7" text-anchor="middle" font-size="11.5">17+ Prometheus metrics, structlog JSON,</text>
<text x="973.0" y="729.6" text-anchor="middle" font-size="11.5">OpenTelemetry traces, 16-panel Grafana</text>
<rect x="1112" y="658" width="250" height="100" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="1.3" filter="url(#sh)"/>
<text x="1237.0" y="695.9" text-anchor="middle" font-size="13.5" font-weight="bold">Downstream</text>
<text x="1237.0" y="712.7" text-anchor="middle" font-size="11.5">Number 2 clustering and SITREPs,</text>
<text x="1237.0" y="729.6" text-anchor="middle" font-size="11.5">ODIN voice agent, reports</text>
<text x="20" y="798" text-anchor="start" font-size="12.5" fill="#555">Throughput: ~3 to 6 s per entry, ~60 entries a minute at batch 20 on a 60 s interval. Source: tiger-eye SYSTEM_DESIGN.md. Open source, MIT.</text>
</svg>